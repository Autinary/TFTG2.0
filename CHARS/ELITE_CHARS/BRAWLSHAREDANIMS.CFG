BLEND 0.2			;Sets the default blend for all anims
RATE 30.0			;Sets the default Frame Rate for all anims
TRACKROOT			;Sets all anims to trackroot

ANIMGROUP idle
	ANIMENTRY idle idle.an3
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP walk
	ANIMENTRY walk walk.an3
		ACTIVATEPOIONCE right_foot 17/30 GENERAL FLOORIMPACT 2.0 1.1
		ACTIVATEPOIONCE left_foot 1/30 GENERAL FLOORIMPACT 2.0 1.1
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP run
	ANIMENTRY run run.an3
		ACTIVATEPOIONCE left_foot 17/20 GENERAL FLOORIMPACT 2.0 1.3
		ACTIVATEPOIONCE right_foot 5/20 GENERAL FLOORIMPACT 2.0 1.3
		NEXTANIM strafe_n MATCHCYCLE blend 0.3
		NEXTANIM strafe_s MATCHCYCLE blend 0.3
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP strafe_idle
	ANIMENTRY strafe_idle strafe_idle.an3
		ACTIVATEPOI right_fist 0 1 GENERAL MISSILEPOS 0
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP strafe_n
	ANIMENTRY strafe_n strafe_n.an3
		ACTIVATEPOI right_fist 0 1 GENERAL MISSILEPOS 0

		ACTIVATEPOIONCE left_foot 19/27 GENERAL FLOORIMPACT 2.0 0.8
		ACTIVATEPOIONCE right_foot 5/27 GENERAL FLOORIMPACT 2.0 1.3

		NEXTANIM run      MATCHCYCLE blend 1.0
		NEXTANIM strafe_s MATCHCYCLE blend 1.0
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP strafe_s
	ANIMENTRY strafe_s strafe_s.an3
