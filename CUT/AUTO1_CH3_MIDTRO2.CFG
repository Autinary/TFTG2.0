;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Sample CutViewer config file
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;; Command Syntax:
;;
;;
;; CUT <cutname> [<cutrate>]
;; cutname - name of file to load (including extension)
;; cutrate - optional playback rate of file - in fps
;;
;;
;; SCENE <scenename> [NORENDER] [BUILDINGS]
;; scenename - scene file to load (including extension)
;;             the file may contain several scene statements, the first one
;;             is the main scene to render, subsequent ones may be specified to
;;             supply props to the cutscene. Additional optional commands are;
;;             NORENDER - the scene will not be rendered. By default the cutviewer will attempt
;;                        to render all loaded scenes
;;
;;             DAMAGE   - the scene contains breakable objects and will be used to initialise
;;                        damage system. By default, the first scene will be considered
;;                        as damagable, this command allows a different scene to be assigned
;;                        this status. Only one scene may be marked as DAMAGE.
;;
;;
;; RTL <rtlname>
;; rtlname - name of Realtime Light file to load (including extension)
;;
;;
;; CHAR <cfgname>
;; cfgname - name of character config file to load. There may be several of these
;;           if your cutscene requires multiple characters
;;
;;
;; PTL <type> <ptlname>
;; type    - how to use the particle file, the possible options are;
;;           GENERAL - file is the general particle file
;;           LEVEL   - file is the level specific character file
;;           CHAR    - file is the character specific file
;; ptlname - name of the particle file to load
;;
;;           One of each type may be specified. Normally all three will be
;;           required. The cutscene will use them in the following order of
;;           preference, CHAR,LEVEL,GENERAL
;;
;;


;; The cutscene
CUT cut\auto1_ch3_midtro2.cc2 30.0

;;;; General setup
INCLUDE cut\tranquility.cfg

;;;; General setup
INCLUDE cut\general.cfg

;; Effects
FULLSCREENMOTIONBLUR 64 1.0 3.0

;; Character definitions
CHAR chars\barricade.cfg
CHAR chars\barricadecar.cfg
CHAR chars\barricadetran.cfg
CHAR chars\bumblebee.cfg
CHAR chars\bumblebeecar.cfg
CHAR chars\bumblebeetran.cfg
CHAR chars\Mikaela.cfg
CHAR chars\Sam.cfg
CHAR chars\Ped_civvyalf.cfg
CHAR chars\Ped_civvyBetty.cfg
CHAR chars\Ped_civvyCarl.cfg
CHAR chars\Ped_civvyBert.cfg

