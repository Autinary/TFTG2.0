RESPONSELEVEL 2         ; Blue

    RESPONSEVEHICLE Tank0 5
        TYPE                  DDRIVETYPE_SHILKA
        MAXVELOCITY           50.0
        SPAWNDELAY            5.0
        SPAWNRANGEMIN         200.0
        SPAWNRANGEMAX         250.0
        PHYSICSRANGE          250.0
        DRAWRANGE             250.0

        CHASE
            ABORTENERGY       50.0
            MINTIME           10.0
            MAXTIME           30.0
            SPDLOSS           0.0          ; from 'target' topspeed @ 150mph
        ENDCHASE

        WEAPONCOMPONENT
            TYPE              WEAPON_SHILKATANK
            RELOADTIME        2.0
            NUMROUNDS         0.0
        ENDWEAPONCOMPONENT

        DAMAGEMODEL this
            ENERGY            150.0
        ENDDAMAGEMODEL         

        SCOREPOINTS this
            PICKUP           -20.0
            DESTROY          -2000.0
            THROWDIST         50.0
            ATTACKSCALE       1.0
            HEALTH            0.0
        ENDSCOREPOINTS
    ENDRESPONSEVEHICLE

