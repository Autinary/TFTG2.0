CREATURE

	CHARACTER Ped_S7Barry
		
		PATH Chars\Pedestrians
		OBJECT Ped_S7Barry.ghg
		
		BLEND 0.2			;Sets the default blend for all anims
		;RATE 30.0			;Sets the default Frame Rate for all anims
			 
		ANIMGROUP walk
			ANIMENTRY walk walk.an3
				Trackroot
				RATE 30.0
				VEL 0.0  0.0  1.119
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP run
			ANIMENTRY run run_look_back.an3
				Trackroot
				RATE 30.0
				VEL 0.0  0.0  2.732
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP dive
			ANIMENTRY dive noload dive.an3
				RATE 30.0
				HOLD
				VEL 8.0/31.0  24.0/31.0  2.303	;start frame of linear movement, end frame of linear movement, linear speed
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP cower
			ANIMENTRY cower noload COWER_Should_I.an3
				RATE 30.0
				Trackroot
;				VEL 1.0/26.0  16.0/26.0  2.6492	;start frame of linear movement, end frame of linear movement, linear speed
			ENDANIMENTRY
		ENDANIMGROUP
			
		ANIMGROUP prone_Idle
			ANIMENTRY prone_Idle noload prone_Idle.an3
				RATE 30.0
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP prone_getup
			ANIMENTRY prone_getup noload prone_getup.an3
				RATE 30.0
				HOLD
				LOCKBEFORE 1.0
			ENDANIMENTRY
		ENDANIMGROUP	

		ANIMGROUP fall
			ANIMENTRY fall noload fallA.an3
				RATE 30.0
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP walk2
			ANIMENTRY walk2 WALK_SLOUCH.an3
				Trackroot
				RATE 30.0
				VEL 0.0  0.0  1.365
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP run2
			ANIMENTRY run2 RUN_JOG.an3
				Trackroot
				RATE 30.0
				VEL 0.0  0.0  3.338
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP dive2
			ANIMENTRY dive2 noload dive2.an3
				RATE 30.0
				HOLD
				VEL 1.0/22.0  13.0/22.0   1.37	; start frame of linear movement, end frame of linear movement, linear speed
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP cower2
			ANIMENTRY cower2 noload cower_Headlights.an3
				Trackroot
				RATE 30.0
				;VEL 1.0/24.0  13.0/24.0   5.714	; start frame of linear movement, end frame of linear movement, linear speed
			ENDANIMENTRY
		ENDANIMGROUP		
		
		ANIMGROUP prone_Idle2
			ANIMENTRY prone_Idle2 noload prone_Idle2.an3
				RATE 30.0
			ENDANIMENTRY
		ENDANIMGROUP
		
		ANIMGROUP prone_getup2
			ANIMENTRY prone_getup2 noload prone_getup2.an3
				RATE 30.0
				HOLD
				LOCKBEFORE 1.0
			ENDANIMENTRY
		ENDANIMGROUP			
		
		ANIMGROUP fall2
			ANIMENTRY fall2 noload fallA.an3
				RATE 30.0
			ENDANIMENTRY
		ENDANIMGROUP		
		
	ENDCHARACTER
	
	; INDEX = pedestrian index, MODE, VEL = start frame, end frame, frameAmount, speed, BLENDFRAMES = num blend frames									
	; end frame is number of actual frames blend frames should represent	
	SETBLENDPARAM	INDEX 0 WALK		VEL 0 30 30 1.3083 BLENDFRAMES 5
	SETBLENDPARAM	INDEX 0 RUN		VEL 0 25 25 5.6084 BLENDFRAMES 7
	SETBLENDPARAM	INDEX 0 DIVE		VEL 1 16 26 2.6492 RATE 30 HOLD BLENDFRAMES 7
	SETBLENDPARAM	INDEX 0 COWER		VEL 0 0  0 2.6492  BLENDFRAMES 
	SETBLENDPARAM	INDEX 0 PRONE_IDLE	VEL 0 10 10 0  BLENDFRAMES 1
	SETBLENDPARAM	INDEX 0 PRONE_GETUP	VEL 0 66 66 0  HOLD BLENDFRAMES 7
	SETBLENDPARAM	INDEX 0 FALLING		VEL 0 24 24 0  BLENDFRAMES 8
	
	SETBLENDPARAM	INDEX 1 WALK		VEL 0 30 30 1.119 BLENDFRAMES 5	
	SETBLENDPARAM	INDEX 1 RUN			VEL 0 25 25 2.861 BLENDFRAMES 7
	SETBLENDPARAM	INDEX 1 DIVE		VEL 1 13 24 5.714 RATE 30 HOLD BLENDFRAMES 7
	SETBLENDPARAM	INDEX 1 COWER		VEL 0 0 0 5.714  BLENDFRAMES
	SETBLENDPARAM	INDEX 1 PRONE_IDLE	VEL 0 10 10 0  BLENDFRAMES 1
	SETBLENDPARAM	INDEX 1 PRONE_GETUP	VEL 0 66 66 0  HOLD BLENDFRAMES 7
	SETBLENDPARAM	INDEX 1 FALLING		VEL 0 24 24 0  BLENDFRAMES 8
	
ENDCREATURE
