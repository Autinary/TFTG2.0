ANIMGROUP strafe_idle
	ANIMENTRY strafe_idle strafe_idle.an3
	BLEND 0.2
	RATE 30.0
	ACTIVATEPOI left_fist 0.0 1.0 GENERAL MISSILEPOS 0
	ACTIVATEPOI right_fist 0.0 1.0 GENERAL MISSILEPOS2 0
	ENDANIMENTRY
ENDANIMGROUP


ANIMGROUP strafe_n
	ANIMENTRY strafe_n strafe_north.an3
	BLEND 0.2
	RATE 30.0
	ACTIVATEPOI left_fist 0.0 1.0 GENERAL MISSILEPOS 0
	ACTIVATEPOI right_fist 0.0 1.0 GENERAL MISSILEPOS2 0

	NEXTANIM strafe_s MATCHCYCLE blend 1.0
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP strafe_s
	ANIMENTRY strafe_s strafe_south.an3
