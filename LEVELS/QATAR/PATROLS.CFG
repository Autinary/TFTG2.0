PATROL Heli1
    SPLINE                D1C1heli1
    SPLINESTARTPOS        1500.0
    TYPE                  DDRIVETYPE_HELI
    MAXVELOCITY           125.0
    SPAWNDELAY            0.0
    DDRIVEAIFLAG          DDRIVEAIFLAGS_DEFAULT
    PHYSICSRANGE          525.0
    DRAWRANGE             500.0
    TRACKERHEIGHTOFFSET   25.0

    CHASE
        ABORTENERGY       50.0
        MINTIME           30.0
        MAXTIME           60.0
        SPDLOSS           0.0 ;75.0          ; from 'target' topspeed @ 150mph
        RANGEON           150.0
        RANGEOFF          525.0
    ENDCHASE

    WEAPONCOMPONENT
        TYPE              WEAPON_HELI
        RELOADTIME        3.0
        NUMROUNDS         0.0
    ENDWEAPONCOMPONENT

    SCOREPOINTS patrol
        PICKUP           -20.0
        DESTROY          -100.0
        THROWDIST         50.0
        ATTACKSCALE       1.0
        HEALTH            0.0
    ENDSCOREPOINTS

    DAMAGEMODEL patrol
        ENERGY            200.0
    ENDDAMAGEMODEL
ENDPATROL


