RESPONSELEVEL 2         ; Blue

    RESPONSEVEHICLE Sector7SUV 4
        TYPE                  DDRIVETYPE_SECTOR7SUV
        MAXVELOCITY           40.0
        SPAWNDELAY            5.0
        SPAWNRANGEMIN         200.0
        SPAWNRANGEMAX         250.0
        PHYSICSRANGE          250.0
        DRAWRANGE             250.0

        CHASE
            ABORTENERGY       50.0
            MINTIME           10.0
            MAXTIME           30.0
            SPDLOSS           0.0          ; from 'target' topspeed @ 150mph
        ENDCHASE

        WEAPONCOMPONENT
            TYPE              WEAPON_POLICECARGUN
            RELOADTIME        0.25
            NUMROUNDS         0.0
        ENDWEAPONCOMPONENT

        DAMAGEMODEL this
            ENERGY            150.0
        ENDDAMAGEMODEL         

        SCOREPOINTS this
            PICKUP           -20.0
            DESTROY          -100.0
            THROWDIST         50.0
            ATTACKSCALE       1.0
            HEALTH            0.0
        ENDSCOREPOINTS
    ENDRESPONSEVEHICLE

