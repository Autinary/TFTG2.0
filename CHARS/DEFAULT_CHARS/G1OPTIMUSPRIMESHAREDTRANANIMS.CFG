
ANIMGROUP transformfall
	ANIMENTRY transform g1_optimus_transform_fall.an3
	BLEND 0.2
	;HOLD
	RATE 30.0
	NEXTANIM transformland LOCKBEFORE 0.1 BLEND 0.2
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP transformland
	ANIMENTRY transform g1_optimus_transform_land.an3
	BLEND 0.2
	HOLD
	TRACKROOT
	RATE 30.0
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP transformskid
	ANIMENTRY transform g1_optimus_transform_skid.an3
	BLEND 0.0
	;HOLD
	RATE 30.0
	ActivatePOI left_foot 0 1 General Sparks1
	ActivatePOI right_foot 0 1 General Sparks2
	ENDANIMENTRY
ENDANIMGROUP

