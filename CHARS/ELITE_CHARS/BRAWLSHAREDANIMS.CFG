		ACTIVATEPOIONCE left_foot   2/26 GENERAL FLOORIMPACT 2.0 1.1
		ACTIVATEPOIONCE right_foot 14/26 GENERAL FLOORIMPACT 2.0 1.1

		NEXTANIM run_n    MATCHCYCLE
		NEXTANIM strafe_n MATCHCYCLE blend 1.0
	ENDANIMENTRY
ENDANIMGROUP

