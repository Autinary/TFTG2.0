
; Level Definitions
;
; PATH <path>                   - where to look for level related data
; SCENE <gscname>               - the name of the gsc file to use for this level (without file extension)
; FIXTERRAINTYPE <Val>          - Overides terrain types for the level with Val
; STARTPOS <x> <y> <z> <dir>
; NOTRACKSKIN			- Dave Stuff
; SKINNAME			- CS added to control splinename withour recompile



; Car Definitions
;
; PATH <path>                   - where to look for car related data
; SCENE <gscname>               - the name of the gsc file to use for this car (without file extension)
; SHADOW <hgoname>              - the name of the hgo file to use for this car shadow (without file extension)
; DRIVER <ghgname>              - the name of the ghg file to use for the main driver (without file extension)

