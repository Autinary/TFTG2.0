CREATURE

	CHARACTER StarscreamTran
				
		PATH Chars\Starscream
		OBJECT transformer.ghg

		DEPENDS StarscreamCar
		DEPENDS Starscream

		TERRINFO 0.34 1.4 0

		BLEND 0.0			;Sets the default blend for all anims
		;RATE 30.0			;Sets the default Frame Rate for all anims
		
		ANIMGROUP transformfromvehicle
			ANIMENTRY transformfromvehicle TransformFromVehicle.an3
			BLEND 0.0
			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP transformfromrobot
			ANIMENTRY transformfromrobot TransformFromRobot.an3
			BLEND 0.0
			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
			TRACKROOT
			ENDANIMENTRY
		ENDANIMGROUP	

	ENDCHARACTER

	VIEWDISTANCE     	 	10.0
	HEARDISTANCE  		5.0
	MAXVIEWHEIGHT   	10.0
	MINVIEWHEIGHT   	-10.0
	RADIUS          	0.2
	SCALE			1.0
	MASS			750.0
	
	DIEWAIT			0.0

ENDCREATURE               
