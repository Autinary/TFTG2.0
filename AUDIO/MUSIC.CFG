;---------------------------------------------------------------------------------------------------------------------------------------
;
; TRANSFORMERS - THE MOOVY  -  see Steve Monks and/or David Whittaker for more info than detailed below.
;
; Tracks are collected into ALBUMs:
; ALBUMs represent all of the tracks for a section of the game, this could be a level or a stage of a level.
; An ALBUM can contain several tracks of each classification:
;
; QUIET/ACTION - these are the primary tracks.  Only one of these can play at a time.  Starting playback of one will cause a cross fade from the other
; and then pause the other.  The paused track will then seek to its next start point if any are specified, otherwise it will continue from where it
; was paused.  A paused position will be lost if another track is cued up on the same streaming channel.
;
; OVERLAY - an overlay track (SUCH as DIALOGUE) can be played at any point and will commandeer which ever track is not currently playing.
; If a crossfade is in process, this will be allowed to complete before the OVERLAY track is played.
;
; Not Implemented YET...
; SIGNATURE - plays on the idle stream when requested.  After playing, the idle streams previous state is restored.
;
; Not Implemented YET...
; CUTSCENE - the sound track for a cutscene.
;
;
; The following options are available on most track types;
;
; IDENT/ID   - an alternative label for the track, if not supplied, the track name may be used to identify the track instead.
;
; INDEX/IX   - track index points (in seconds).  If specified, whenever the track is restarted, it will begin from the next index point. Several of these
;              may be specified and will be sequenced in order of specification.  If no index points are specified, the track will continue from where it
;              left off, unless it loses its channel while paused, in which case it will restart from the beginning.  To force a track to always restart
;              from the beginnning just add a single IX 0.
;
; NODUCK     - prevents this track being affected by ducking.
;
; DUCK       - specifies that this track should cause all other music and spot effects to be attenuated by the specified value.
;              If the number is less than 0.0, it is considered to be in dB.
;              If the number is greater than or equal to 0.0, it is considered to be in amplitude (0.0 to 1.0 range).
;              A second value specifies how long the ducking should take.
;
; NOMUSIC    - if specified, allows an alternate track to be played, if the system has been told to disable music.  Useful for replacing the Quiet track
;              with one containing just ambient sounds.  By default, NOMUSIC will default to playing nothing.  Attempts by the system to play nothing will
;              cause nothing to change (i.e. any tracks that are actually playing will not be disturbed).
;
; LOOPING    - indicates that the track should LOOP when finished, certain classes are implied as LOOPing, these are QUIET & ACTION.
;
; NONLOOPING - indicates that the track should not LOOP when finished, certain classes are implied as non LOOPing - these are SIGNATURE, OVERLAY, CUTSCENE.
;
;
; ALBUM <album name>
;	QUIET     <track name>  [IDENT <optional name>] [IX <time>]  [NOMUSIC <track name>] [NODUCK]  [LOOPING/LOOP] [NONLOOPING/NOLOOP]
;	ACTION    <track name>  [IDENT <optional name>] [IX <time>]  [NOMUSIC <track name>] [NODUCK]  [LOOPING/LOOP] [NONLOOPING/NOLOOP]
;	OVERLAY   <track name>  [IDENT <optional name>] [IX <time>]  [NOMUSIC <track name>] [NODUCK]  [LOOPING/LOOP] [NONLOOPING/NOLOOP]
;
; Not Implemented YET
;	SIGNATURE <track name>  [IDENT <optional name>] [IX <time>]  [NOMUSIC <track name>] [NODUCK]  [LOOPING/LOOP] [NONLOOPING/NOLOOP]
;	CUTSCENE  <track name>  [IDENT <optional name>] [IX <time>]  [NOMUSIC <track name>] [NODUCK]  [LOOPING/LOOP] [NONLOOPING/NOLOOP]
;---------------------------------------------------------------------------------------------------------------------------------------

; ID conventions
; GENERIC - on a quiet track, this is the normal quiet track that will be played during this level when not in a mission
; GENERIC - on a action track, this is the normal action track that will be played during this level when not in a mission
; MISSIONn - where 'n' is 1 to 4, this is the action track that will be played during the relevant mission
; TAGn - where 'n' is 1 to 2, this is the success/failed jingle

; Note: when not in a mission, the transformers code will switch between GENERIC action and GENERIC quiet tracks depending on police activity.
; If there is no quiet track, it will play the GENERIC action track


