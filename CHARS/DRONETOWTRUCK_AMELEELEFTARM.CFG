CREATURE

	CHARACTER DroneTowTruck_aLeftArm

		PATH Chars\TowTruck
		OBJECT meleeWeapon.ghg

		DEPENDS DroneTowTruck_a

		BLEND 0
		RATE 30
		;LOCKBEFORE 1

		DEFINEPOI		hook		1
		DEFINEPOI		chain_a		2
		DEFINEPOI		chain_b		3

		ANIMGROUP spin_hook_start
			ANIMENTRY spin_hook_start weapon_spin_hook_start.AN3
				BLEND 0.2
				HOLD
				LOCKBEFORE 1.0
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP spin_hook_idle
			ANIMENTRY spin_hook_idle weapon_spin_hook_idle.AN3
				ACTIVATEPOI hook 0.0 1.0 GENERAL FLAIL start NORMALMAX
				ACTIVATEPOI chain_b 0.0 1.0 GENERAL FLAIL end NORMALMAX
				ACTIVATEPOIONCE hook 0.2 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.4 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.6 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.8 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 1.0 GENERAL FLAIL reset

				ACTIVATEPOI hook 0.0 1.0 GENERAL STREAK1 start
				ACTIVATEPOI chain_b 0.0 1.0 GENERAL STREAK1 end
				ACTIVATEPOI chain_a 0.0 1.0 GENERAL STREAK2 start
				ACTIVATEPOI hook 0.0 1.0 GENERAL STREAK2 end

			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP spin_hook_walk
			ANIMENTRY spin_hook_walk weapon_spin_hook_walk.AN3
				ACTIVATEPOI hook 0.0 1.0 GENERAL FLAIL start NORMALMAX
				ACTIVATEPOI chain_b 0.0 1.0 GENERAL FLAIL end NORMALMAX
				ACTIVATEPOIONCE hook 0.2 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.4 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.6 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 0.8 GENERAL FLAIL reset
				ACTIVATEPOIONCE hook 1.0 GENERAL FLAIL reset

				ACTIVATEPOI hook 0.0 1.0 GENERAL STREAK1 start
				ACTIVATEPOI chain_b 0.0 1.0 GENERAL STREAK1 end
				ACTIVATEPOI chain_a 0.0 1.0 GENERAL STREAK2 start
				ACTIVATEPOI hook 0.0 1.0 GENERAL STREAK2 end

			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP recoil1
			ANIMENTRY recoil1 weapon_spin_hook_end.AN3
				LOCKBEFORE 1.0
				ACTIVATEPOIONCE none 1.0 General Transform LeftArm Normal DroneTowTruck
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP recoil2
			ANIMENTRY recoil1 weapon_spin_hook_end.AN3
				LOCKBEFORE 1.0
				ACTIVATEPOIONCE none 1.0 General Transform LeftArm Normal DroneTowTruck
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP flybackinair
			ANIMENTRY recoil1 weapon_spin_hook_end.AN3
				LOCKBEFORE 1.0
				ACTIVATEPOIONCE none 1.0 General Transform LeftArm Normal DroneTowTruck
			ENDANIMENTRY
		ENDANIMGROUP

	ENDCHARACTER

ENDCREATURE
