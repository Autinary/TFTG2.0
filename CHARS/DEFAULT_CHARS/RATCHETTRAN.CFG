
CREATURE
	CHARACTER Ratchet_Transform
		PATH Chars\Ratchet
		OBJECT Ratchet_transform.GHG

		DEPENDS Rachet
		DEPENDS	RachetCar

		DEFINEPOI lefthand 		0
		DEFINEPOI righthand		1
		DEFINEPOI leftfoot 		2
		DEFINEPOI rightfoot		3


		ANIMGROUP transformfromvehicle
			ANIMENTRY transform transform.an3
			RATE 30.0
			BLEND 0.2
			HOLD		
			ENDANIMENTRY
		ENDANIMGROUP  

		ANIMGROUP transformfromrobot
			ANIMENTRY transform_reverse transform_reverse.AN3
			RATE 30.0
			BLEND 0.2
			HOLD		
			ENDANIMENTRY
		ENDANIMGROUP 


                            ANIMGROUP vehicleland
                                    ANIMENTRY vehicleland transform_car_land.an3
                                    BLEND 0.0
                                    RATE 30.0
                                    HOLD
                                    LOCKBEFORE 1.0
                                    TRACKROOT
                                    ENDANIMENTRY
                        ENDANIMGROUP


	ENDCHARACTER
ENDCREATURE
