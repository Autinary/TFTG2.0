
PATROL Jimmy1
    SPLINE                Patrol1
    SPLINESTARTPOS        0.0
    TYPE                  DDRIVETYPE_POLICECAR
    MAXVELOCITY           50.0
    SPAWNDELAY            10.0
    DDRIVEAIFLAG          DDRIVEAIFLAGS_DEFAULT
    PHYSICSRANGE          125.0
    DRAWRANGE             150.0
    TRACKERHEIGHTOFFSET   10.0

    CHASE
        ABORTENERGY       200.0
        MINTIME           30.0
        MAXTIME           60.0
        SPDLOSS           0.0 ;75.0          ; from 'target' topspeed @ 150mph
    ENDCHASE

    WEAPONCOMPONENT
        TYPE              WEAPON_S7_JEEP
        RELOADTIME        2.0
        NUMROUNDS         0.0
    ENDWEAPONCOMPONENT

    SCOREPOINTS patrol
        PICKUP           -20.0
        DESTROY          -50.0
        THROWDIST         50.0
        ATTACKSCALE       1.0
        HEALTH            0.0
    ENDSCOREPOINTS

    DAMAGEMODEL patrol
        ENERGY            500.0
        DAMAGE_MIN        5.0
        DAMAGE_MAX        50.0
    ENDDAMAGEMODEL
ENDPATROL



