RESPONSESCORING
    SCORE_RANGE                 100.0           ; Overal range
    SCORE_SCALE                 1.0             ; Overal scalar
    SCORE_DESTRUCTION_SCALE     0.1             ; Damage scalar
    SCORE_ROBOTMODE             1.0             ; Points per second when player is in robotmode
    SCORE_ROBOTMODE_DAMAGE      2.0             ; Points per second when player does damage in robotmode
    SCORE_VEHICLEMODE          -1.0             ; Points per second when player is in vehiclemode
    SCORE_VEHICLEMODE_DAMAGE   -1.0             ; Points per second when player does damage in vehiclemode
ENDRESPONSESCORING

