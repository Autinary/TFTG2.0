RESPONSELEVEL 1

;    LIMITACTIVE               1           ; limit number of active vehicles at one time

    RESPONSEVEHICLE Jimmy 0
        TYPE                  DDRIVETYPE_POLICECAR
        MAXVELOCITY           75.0
        SPAWNDELAY            5.0
        SPAWNRANGEMIN         200.0
        SPAWNRANGEMAX         250.0
        PHYSICSRANGE          250.0
        DRAWRANGE             250.0

        CHASE
            ABORTENERGY       200.0
            MINTIME           30.0
            MAXTIME           60.0
            SPDLOSS           75.0          ; from 'target' topspeed @ 150mph
        ENDCHASE

        DAMAGEMODEL this
            ENERGY            500.0
            DAMAGE_MIN        5.0
            DAMAGE_MAX        50.0
        ENDDAMAGEMODEL         

        SCOREPOINTS this
            PICKUP           -20.0
            DESTROY          -50.0
            THROWDIST         50.0
            ATTACKSCALE       1.0
            HEALTH            0.0
        ENDSCOREPOINTS
    ENDRESPONSEVEHICLE

ENDRESPONSELEVEL

