			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
			ACTIVELAYERS 0.0 1.0 0 1 2 3 4 5
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP vehicleland
                        ANIMENTRY vehicleland transform_car_land.an3
                        BLEND 0.0
                        RATE 30.0
                        HOLD
                        LOCKBEFORE 1.0
                        TRACKROOT
                        ENDANIMENTRY
                ENDANIMGROUP

	ENDCHARACTER

	VIEWDISTANCE     	 	10.0
