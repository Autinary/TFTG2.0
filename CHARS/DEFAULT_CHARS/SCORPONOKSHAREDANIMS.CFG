DEFINEJOINT waist			0

DEFINEPOI left_fist 		0
DEFINEPOI right_fist		1
DEFINEPOI left_foot 		6
DEFINEPOI right_foot		7

DEFINEPOI small_pickup		1
DEFINEPOI pole_pickup		8
DEFINEPOI block_pickup		9
DEFINEPOI chest			10
DEFINEPOI weapon		11

DEFINEPOI tail			2

TERRINFO 2 1 0

BLEND 0.2			;Sets the default blend for all anims
;RATE 30.0			;Sets the default Frame Rate for all anims
TRACKROOT			;Sets all anims to trackroot
		
ANIMGROUP idle
	ANIMENTRY idle idle.an3
	BLEND 0.2
	RATE 30.0
	TRACKROOT
	ENDANIMENTRY
ENDANIMGROUP

ANIMGROUP walk
	ANIMENTRY walk walk.an3
	RATE 30.0
	BLEND 0.1
	ENDANIMENTRY
