CREATURE

	CHARACTER OptimusPrimeTran
		
		PATH Chars\OptimusPrime
		OBJECT transformer.ghg
		
		DEPENDS OptimusPrime
		DEPENDS OptimusPrimeCar

		TERRINFO 0.34 1.4 0

		BLEND 0.0			;Sets the default blend for all anims
		;RATE 30.0			;Sets the default Frame Rate for all anims

		ANIMGROUP transformfromvehicle
			ANIMENTRY transformfromvehicle TransformFromVehicle.AN3
			BLEND 0.0
			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
	NEXTANIM transformfall LOCKBEFORE 0.1 BLEND 0.2

			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP transformfromrobot
			ANIMENTRY transformfromrobot TransformFromRobot.AN3
			BLEND 0.0
			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
			ENDANIMENTRY
		ENDANIMGROUP

		ANIMGROUP vehicleland
			ANIMENTRY vehicleland transform_car_land.an3
			BLEND 0.0
			RATE 30.0
			HOLD
			LOCKBEFORE 1.0
			TRACKROOT
			ENDANIMENTRY
		ENDANIMGROUP



	ENDCHARACTER

	VIEWDISTANCE     	 	10.0
	HEARDISTANCE  		5.0
	MAXVIEWHEIGHT   	10.0
	MINVIEWHEIGHT   	-10.0
	RADIUS          	0.2
	SCALE			1.0
	MASS			750.0
	
	DIEWAIT			0.0

ENDCREATURE               
