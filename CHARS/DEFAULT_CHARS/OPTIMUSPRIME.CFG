CREATURE

	CHARACTER OptimusPrime

		PATH Chars\OptimusPrime
		OBJECT ROBOT.ghg

		INCLUDE Chars\Default_Chars\OptimusPrimeSharedAnims.cfg
		INCLUDE Chars\Default_Chars\OptimusPrimeSharedWalkAnims.cfg
		INCLUDE Chars\Default_Chars\OptimusPrimeSharedTranAnims.cfg

	ENDCHARACTER

	INCLUDE Chars\Default_Chars\OptimusPrimeSharedAttribs.cfg
	INCLUDE Chars\Default_Chars\OptimusPrimeSharedWalkAttribs.cfg
	INCLUDE Chars\Default_Chars\OptimusPrimeSharedTranAttribs.cfg
	EnableAbility           TransformVehicleLand

	TransformingBodyPart 2 LeftArm -1 chars/default_chars/OptimusPrimeMeleeLeftArm.cfg Melee
	TransformingBodyPart 3 RightArm -1 chars/default_chars/OptimusPrimeMeleeRightArm.cfg Melee
;	TransformingBodyPart 3 RightArm -1 chars/default_chars/OptimusPrimeGunArm.cfg Ranged
;	TransformingBodyPart 3 RightArm -1 chars/default_chars/OptimusPrimeGunArm.cfg Ranged
	TransformingBodyPart -1 VehicleWeapon 1 chars/default_chars/OptimusPrimeVehicleWeapons.cfg
	TransformingBodyPart 0 LeftArm -1 chars/default_chars/OptimusPrimeLeftPistol.cfg Ranged
	TransformingBodyPart 1 RightArm -1 chars/default_chars/OptimusPrimeRightPistol.cfg Ranged


ENDCREATURE
