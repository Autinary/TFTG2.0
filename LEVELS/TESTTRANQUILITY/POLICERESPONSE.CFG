RESPONSELEVEL 2         ; Blue

    RESPONSEVEHICLE Police 4
        TYPE                  DDRIVETYPE_POLICECAR
        MAXVELOCITY           75.0
        SPAWNDELAY            5.0
        SPAWNRANGEMIN         200.0
        SPAWNRANGEMAX         250.0
        PHYSICSRANGE          250.0
        DRAWRANGE             250.0

        CHASE
            ABORTENERGY       50.0
            MINTIME           10.0
            MAXTIME           30.0
            SPDLOSS           60.0          ; from 'target' topspeed @ 150mph
        ENDCHASE

        DAMAGEMODEL this
            ENERGY            150.0
        ENDDAMAGEMODEL         

        WEAPONCOMPONENT
            TYPE              WEAPON_POLICECARGUN
            RELOADTIME        2.0
            NUMROUNDS         0.0
        ENDWEAPONCOMPONENT

        SCOREPOINTS this
            PICKUP           -20.0
            DESTROY          -50.0
            THROWDIST         50.0
            ATTACKSCALE       1.0
            HEALTH            0.0
        ENDSCOREPOINTS
    ENDRESPONSEVEHICLE

