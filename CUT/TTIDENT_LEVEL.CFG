	; old bloom effect (called burnout)
	BURNOUT 0.30
	BURNOUTTHRESHOLD 0

	; BLOOM onOrOff
	BLOOM	1
	; BLOOMPARAMETERS = start angle, minimum intensity, end angle, maximum intensity, global multiplier, hide original image
	; angles = 0 (down) -> 180 (up) : intensities = 0 (off) -> 1 (full on) : hide = 0 (off) -> 1 (on)
	BLOOMPARAMETERS 80.0 0.1 140.0 1.0 1.0 0 

	SHADOWON			1
	SHADOWDIR			326.0 226.0
	SHADOWINTENSITY		0.5
	SHADOWBLUR			0.767 57.222
	SHADOWMINBLURINESS	0.5
	SHADOWFALLOFF		160.0 170.0
	SHADOWWARPA			2.0
	SHADOWSCALEBIASA	0.0008 0.1
	SHADOWWARPB			6.0
	SHADOWSCALEBIASB	0.0017 0.1

	TEXTUREFILTERING 0.0 1

	PLATFORM NEXTGEN
	; BLOOM onOrOff
	BLOOM	1
	; BLOOMPARAMETERS = start angle, minimum intensity, end angle, maximum intensity, global multiplier, hide original image
	; angles = 0 (down) -> 180 (up) : intensities = 0 (off) -> 1 (full on) : hide = 0 (off) -> 1 (on)
	BLOOMPARAMETERS 80.0 0.1 140.0 0.7 1.0 10.0
	; DIRECTIONALBLOOM onOrOff
	DIRECTIONALBLOOM	0
	; POSITIONALBLOOMPARAMETERS = directional (x,y,z) inner radius, inner intensity, outer radius, outer intensity, fall off power
	DIRECTIONALBLOOMPARAMETERS 0.924 0.166 -0.345 5.0 0.35 45.0 0.0 1.0
	PERFRAGMENTBLOOM	10.0

	SHADOWON		1
	SHADOWDIR		326.0 226.0
	SHADOWINTENSITY		0.5
	SHADOWBLUR		0.767 57.222
	SHADOWMINBLURINESS	0.5
	SHADOWFALLOFF		160.0 170.0
	SHADOWWARPA		2.0
	SHADOWSCALEBIASA	0.0008 0.1
	SHADOWWARPB		6.0
	SHADOWSCALEBIASB	0.0017 0.1

	TINT		1
	TINTCOLOUR	33 40 12
	TINTSTRENGTH	60
	TINTMODE	ADD
		
	TEXTUREFILTERING 0.0 1
	ENDPLATFORM

