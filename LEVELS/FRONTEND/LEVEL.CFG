LEVEL FrontEnd

	LEVELTYPE	AUTOBOT

	PATH Levels/FrontEnd
	DATAPATH Levels/FrontEnd
	AI2PATH Levels/FrontEnd
	
	LANGUAGE French
		SCENE FrontEnd_Fre
	ENDLANGUAGE
	LANGUAGE !French
		SCENE FrontEnd
	ENDLANGUAGE

	;EXTRATHING	Standard 0
	EXTRATHING	Camera 0
	EXTRATHING	GameCam 0
	EXTRATHING	GUIManager 0
	EXTRATHING	SceneManager 0
	EXTRATHING  LevelManager 0

	SKIES	-1,-1

	PLATFORM CURRGEN
		; BLOOM onOrOff
		BLOOM	1
		; BLOOMPARAMETERS = start angle, minimum intensity, end angle, maximum intensity, global multiplier, hide original image
		; angles = 0 (down) -> 180 (up) : intensities = 0 (off) -> 1 (full on) : hide = 0 (off) -> 1 (on)
		BLOOMPARAMETERS 0.0 1.0 180.0 1.0 0.42 0.0

		PERFRAGMENTBLOOM	1.0
	ENDPLATFORM

	PLATFORM NEXTGEN
		; BLOOM onOrOff
		BLOOM	1
		; BLOOMPARAMETERS = start angle, minimum intensity, end angle, maximum intensity, global multiplier, hide original image
		; angles = 0 (down) -> 180 (up) : intensities = 0 (off) -> 1 (full on) : hide = 0 (off) -> 1 (on)
		BLOOMPARAMETERS 0.0 1.0 180.0 1.0 0.25 0.0

		PERFRAGMENTBLOOM	5.0

		SHADOWON			1
		SHADOWDIR			290.00 294.00
		SHADOWINTENSITY			0.6
		SHADOWBLUR			0.01 50.0
		SHADOWMINBLURINESS		0.3
		SHADOWFALLOFF			160.0 170.0
		SHADOWWARPA			2.0
		SHADOWSCALEBIASA		0.0008 0.1
		SHADOWWARPB			6.0
		SHADOWSCALEBIASB		0.006 0.1
	ENDPLATFORM

	MUSIC Temp_Action	00.00	;; High tempo
      MUSIC Temp_Quiet	00.00	;; Low tempo

	NUMCUTSCENES 31

	;; Open anims for menus containing 1 button, 2 buttons,etc
	CUTSCENE	"AMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/1MenuOpen.cu2" LOAD
	CUTSCENE	"BMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/2MenuOpen.cu2" LOAD
	CUTSCENE	"CMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/3MenuOpen.cu2" LOAD
	CUTSCENE	"DMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/4MenuOpen.cu2" LOAD
	CUTSCENE	"EMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/5MenuOpen.cu2" LOAD
	CUTSCENE	"FMenuOpen"			"ui_allspark_menu_spin_in"	"cutscene/6MenuOpen.cu2" LOAD

	;; Close anims for menus containing 1 button, 2 buttons,etc
	CUTSCENE	"AMenuClose"		"dummy"						"cutscene/1MenuClose.cu2" LOAD
	CUTSCENE	"BMenuClose"		"dummy"						"cutscene/2MenuClose.cu2" LOAD
	CUTSCENE	"CMenuClose"		"dummy"						"cutscene/3MenuClose.cu2" LOAD
	CUTSCENE	"DMenuClose"		"dummy"						"cutscene/4MenuClose.cu2" LOAD
	CUTSCENE	"EMenuClose"		"dummy"						"cutscene/5MenuClose.cu2" LOAD
	CUTSCENE	"FMenuClose"		"dummy"						"cutscene/6MenuClose.cu2" LOAD
	
	CUTSCENE	"CombinedStart"		"dummy"						"cutscene/CombinedStart.CU2" LOAD
	CUTSCENE	"CubeSpinOut"		"dummy"						"cutscene/CubeSpinOut.CU2" LOAD
	CUTSCENE	"CubeShutDown"		"dummy"						"cutscene/CubeShutDown.CU2" LOAD
	CUTSCENE	"CubeRotate"		"dummy"						"cutscene/CubeRotate.CU2" LOAD
	
	CUTSCENE	"AutoHeadAppear"	"dummy"						"cutscene/EnterAuto.CU2" LOAD
	CUTSCENE	"DConToAuto"		"ui_allspark_autobot"		"cutscene/DCon2Auto.CU2" LOAD
	CUTSCENE	"AutoToDCon"		"ui_allspark_decepticon"	"cutscene/Auto2DCon.CU2" LOAD
	CUTSCENE	"ExitAuto"			"ui_allspark_faction_exit"	"cutscene/ExitAuto.CU2" LOAD
	CUTSCENE	"ExitDCon"			"ui_allspark_faction_exit"	"cutscene/ExitDCon.CU2" LOAD
		
	CUTSCENE	"EarthRise"			"dummy"						"cutscene/EarthRise.CU2" LOAD
	
	CUTSCENE	"MoviesOpen"		"ui_gallery_enlarge"		"cutscene/MoviesScreenOpen.CU2" LOAD
	CUTSCENE	"MoviesClose"		"ui_gallery_shrink"			"cutscene/MoviesScreenClose.CU2" LOAD
	
	CUTSCENE	"LogoAppear"		"ui_logo_reveal"			"cutscene/TTheGameShortLogo.CU2" LOAD
	CUTSCENE	"LogoAppearWide"	"ui_logo_reveal"			"cutscene/TTheGameShortLogoW.CU2" LOAD
	CUTSCENE	"LogoDropDown"		"ui_start_button"			"cutscene/TTheGameDropLogo.CU2" LOAD

	CUTSCENE	"LeftArrowShow"		"dummy"						"cutscene/LeftArrowShow.CU2" LOAD
	CUTSCENE	"LeftArrowHide"		"dummy"						"cutscene/LeftArrowHide.CU2" LOAD
	CUTSCENE	"RightArrowShow"	"dummy"						"cutscene/RightArrowShow.CU2" LOAD
